<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Arc-Spline Viewer</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 350px;
            z-index: 100;
        }
        #controls h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        .button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px 5px 5px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .button:hover {
            background: #45a049;
        }
        .button.danger {
            background: #f44336;
        }
        .button.danger:hover {
            background: #da190b;
        }
        .info {
            margin: 10px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .stat {
            margin: 5px 0;
        }
        .label {
            color: #aaa;
        }
        .value {
            color: #fff;
            font-weight: bold;
        }
        .c1-ok {
            color: #4CAF50;
        }
        .c1-bad {
            color: #f44336;
        }
        .instructions {
            margin-top: 15px;
            font-size: 12px;
            color: #bbb;
            line-height: 1.6;
        }
        #status {
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 12px;
            color: #4CAF50;
        }
        .control-group {
            margin: 12px 0;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 12px;
        }
        .control-group select {
            width: 100%;
            padding: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="controls">
        <h3>🎨 Interactive Arc-Spline</h3>

        <div class="info">
            <div class="stat">
                <span class="label">Points:</span>
                <span class="value" id="pointCount">0</span>
            </div>
            <div class="stat">
                <span class="label">Segments:</span>
                <span class="value" id="segmentCount">0</span>
            </div>
            <div class="stat">
                <span class="label">C¹-Continuity:</span>
                <span class="value" id="continuity">-</span>
            </div>
        </div>

        <div class="control-group">
            <label>Controller Normal (Plane Orientation)</label>
            <select id="normalSelect">
                <option value="0,0,1">+Z (XY Plane)</option>
                <option value="0,1,0">+Y (XZ Plane)</option>
                <option value="1,0,0">+X (YZ Plane)</option>
                <option value="0.577,0.577,0.577">Diagonal (3D)</option>
            </select>
        </div>

        <button class="button" onclick="undoLastPoint()">↶ Undo Point</button>
        <button class="button danger" onclick="clearSpline()">✕ Clear All</button>

        <div class="instructions">
            <strong>📝 Instructions:</strong><br>
            • <strong>Left Click</strong> on ground to add points<br>
            • <strong>Right Drag</strong> to rotate camera<br>
            • <strong>Mouse Wheel</strong> to zoom<br>
            • Each new point creates an arc segment with C¹-continuity
        </div>

        <div id="status">Ready to draw! Click on the ground plane to start.</div>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // State
        let points = [];
        let scene = null;
        let ground = null;
        let splineMeshes = [];
        let pointMarkers = [];

        const createScene = () => {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.15, 1.0);

            // Camera
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                -Math.PI / 2,
                Math.PI / 3,
                10,
                new BABYLON.Vector3(1, 1, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;
            camera.lowerRadiusLimit = 2;
            camera.upperRadiusLimit = 50;

            // Lights
            const light1 = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light1.intensity = 0.7;

            const light2 = new BABYLON.PointLight("light2", new BABYLON.Vector3(5, 5, 5), scene);
            light2.intensity = 0.5;

            // Ground plane for picking
            ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 20, height: 20, subdivisions: 20 }, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.25);
            groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
            groundMat.alpha = 0.3;
            groundMat.wireframe = true;
            ground.material = groundMat;
            ground.position.y = 0;

            // Coordinate axes
            const axisSize = 2;
            const axisX = BABYLON.MeshBuilder.CreateLines("axisX", {
                points: [BABYLON.Vector3.Zero(), new BABYLON.Vector3(axisSize, 0, 0)]
            }, scene);
            axisX.color = new BABYLON.Color3(1, 0, 0);

            const axisY = BABYLON.MeshBuilder.CreateLines("axisY", {
                points: [BABYLON.Vector3.Zero(), new BABYLON.Vector3(0, axisSize, 0)]
            }, scene);
            axisY.color = new BABYLON.Color3(0, 1, 0);

            const axisZ = BABYLON.MeshBuilder.CreateLines("axisZ", {
                points: [BABYLON.Vector3.Zero(), new BABYLON.Vector3(0, 0, axisSize)]
            }, scene);
            axisZ.color = new BABYLON.Color3(0, 0, 1);

            return scene;
        };

        const addPointMarker = (position, index) => {
            const sphere = BABYLON.MeshBuilder.CreateSphere(
                `point${index}`,
                { diameter: 0.15 },
                scene
            );
            sphere.position = position;

            const mat = new BABYLON.StandardMaterial(`pointMat${index}`, scene);
            mat.diffuseColor = index === 0
                ? new BABYLON.Color3(0, 1, 0)  // Green for start
                : new BABYLON.Color3(1, 0.5, 0);  // Orange for others
            mat.emissiveColor = mat.diffuseColor.scale(0.3);
            sphere.material = mat;

            pointMarkers.push(sphere);
        };

        const updateSpline = async () => {
            if (points.length < 2) {
                document.getElementById('pointCount').textContent = points.length;
                document.getElementById('segmentCount').textContent = '0';
                document.getElementById('continuity').textContent = '-';
                document.getElementById('status').textContent =
                    points.length === 0
                        ? 'Ready to draw! Click on the ground plane to start.'
                        : 'Add at least one more point to create a spline.';
                return;
            }

            // Get controller normal
            const normalSelect = document.getElementById('normalSelect');
            const normalStr = normalSelect.value.split(',');
            const controllerNormal = {
                x: parseFloat(normalStr[0]),
                y: parseFloat(normalStr[1]),
                z: parseFloat(normalStr[2])
            };

            // Send to backend
            try {
                document.getElementById('status').textContent = 'Computing arc-spline...';

                const response = await fetch('/api/arcspline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        points: points,
                        controllerNormal: controllerNormal
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const splineData = await response.json();
                renderSpline(splineData);

                document.getElementById('status').textContent = '✓ Spline computed successfully!';
                document.getElementById('status').style.color = '#4CAF50';
            } catch (error) {
                console.error('Error computing spline:', error);
                document.getElementById('status').textContent = '✗ Error: ' + error.message;
                document.getElementById('status').style.color = '#f44336';
            }
        };

        const renderSpline = (splineData) => {
            // Clear old spline meshes
            splineMeshes.forEach(mesh => mesh.dispose());
            splineMeshes = [];

            // Update UI
            document.getElementById('pointCount').textContent = points.length;
            document.getElementById('segmentCount').textContent = splineData.segmentCount;

            // Check C1 continuity
            let allC1 = true;
            for (const conn of splineData.connections) {
                if (conn.angleDegrees > 1.0) {
                    allC1 = false;
                    break;
                }
            }
            const continuityEl = document.getElementById('continuity');
            continuityEl.textContent = allC1 ? '✓ Yes' : '✗ No';
            continuityEl.className = allC1 ? 'value c1-ok' : 'value c1-bad';

            // Render segments
            const colors = [
                new BABYLON.Color3(1, 0.3, 0.3),    // Red
                new BABYLON.Color3(0.3, 1, 0.3),    // Green
                new BABYLON.Color3(0.3, 0.3, 1),    // Blue
                new BABYLON.Color3(1, 1, 0.3),      // Yellow
                new BABYLON.Color3(1, 0.3, 1),      // Magenta
                new BABYLON.Color3(0.3, 1, 1)       // Cyan
            ];

            for (let i = 0; i < splineData.segments.length; i++) {
                const segment = splineData.segments[i];
                const color = colors[i % colors.length];

                // Create curve from samples
                const curvePoints = segment.samples.map(p =>
                    new BABYLON.Vector3(p[0], p[1], p[2])
                );

                // Tube mesh
                const tube = BABYLON.MeshBuilder.CreateTube(
                    `segment${i}`,
                    {
                        path: curvePoints,
                        radius: 0.04,
                        cap: BABYLON.Mesh.CAP_ALL,
                        updatable: false
                    },
                    scene
                );

                const tubeMaterial = new BABYLON.StandardMaterial(`tubeMat${i}`, scene);
                tubeMaterial.diffuseColor = color;
                tubeMaterial.emissiveColor = color.scale(0.2);
                tubeMaterial.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                tube.material = tubeMaterial;

                splineMeshes.push(tube);
            }

            // Render connection points and tangents
            for (let i = 0; i < splineData.connections.length; i++) {
                const conn = splineData.connections[i];
                const point = new BABYLON.Vector3(conn.point[0], conn.point[1], conn.point[2]);

                // Connection point marker
                const connSphere = BABYLON.MeshBuilder.CreateSphere(
                    `conn${i}`,
                    { diameter: 0.1 },
                    scene
                );
                connSphere.position = point;
                const connMat = new BABYLON.StandardMaterial(`connMat${i}`, scene);
                connMat.diffuseColor = conn.angleDegrees < 1.0
                    ? new BABYLON.Color3(0, 1, 1)  // Cyan for good C1
                    : new BABYLON.Color3(1, 1, 0); // Yellow for bad C1
                connSphere.material = connMat;
                splineMeshes.push(connSphere);

                // Tangent vectors (scaled for visibility)
                const scale = 0.3;
                const t1End = point.add(new BABYLON.Vector3(
                    conn.tangent1[0] * scale,
                    conn.tangent1[1] * scale,
                    conn.tangent1[2] * scale
                ));
                const t2End = point.add(new BABYLON.Vector3(
                    conn.tangent2[0] * scale,
                    conn.tangent2[1] * scale,
                    conn.tangent2[2] * scale
                ));

                const tangent1Line = BABYLON.MeshBuilder.CreateLines(
                    `tangent1_${i}`,
                    { points: [point, t1End] },
                    scene
                );
                tangent1Line.color = new BABYLON.Color3(1, 1, 0);
                splineMeshes.push(tangent1Line);

                const tangent2Line = BABYLON.MeshBuilder.CreateLines(
                    `tangent2_${i}`,
                    { points: [point, t2End] },
                    scene
                );
                tangent2Line.color = new BABYLON.Color3(1, 0.5, 0);
                splineMeshes.push(tangent2Line);
            }
        };

        const clearSpline = () => {
            points = [];
            splineMeshes.forEach(mesh => mesh.dispose());
            splineMeshes = [];
            pointMarkers.forEach(marker => marker.dispose());
            pointMarkers = [];

            document.getElementById('pointCount').textContent = '0';
            document.getElementById('segmentCount').textContent = '0';
            document.getElementById('continuity').textContent = '-';
            document.getElementById('status').textContent = 'Ready to draw! Click on the ground plane to start.';
            document.getElementById('status').style.color = '#4CAF50';
        };

        const undoLastPoint = () => {
            if (points.length > 0) {
                points.pop();
                const marker = pointMarkers.pop();
                if (marker) marker.dispose();
                updateSpline();
            }
        };

        // Main initialization
        scene = createScene();

        // Mouse click to add points
        scene.onPointerDown = (evt, pickResult) => {
            if (evt.button === 0 && pickResult.hit && pickResult.pickedMesh === ground) {
                const point = {
                    x: pickResult.pickedPoint.x,
                    y: pickResult.pickedPoint.y,
                    z: pickResult.pickedPoint.z
                };
                points.push(point);
                addPointMarker(pickResult.pickedPoint, points.length - 1);
                updateSpline();
            }
        };

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
